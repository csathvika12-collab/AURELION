<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Connection Tester</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .card { border: 1px solid #ccc; padding: 1.5rem; border-radius: 8px; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; }
        input { width: 100%; padding: 0.5rem; margin-bottom: 0.5rem; box-sizing: border-box; }
        button { padding: 0.5rem 1rem; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0051a2; }
        #status { margin-top: 1rem; padding: 1rem; background: #f0f0f0; border-radius: 4px; white-space: pre-wrap; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>OTT Backend Tester</h1>
    <div class="card">
        <h2>Sign Up Test</h2>
        <div class="form-group">
            <label>Email (must be csathvika10@gmail.com for email test):</label>
            <input type="email" id="email" value="csathvika10@gmail.com">
        </div>
        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" id="fullname" value="Test User">
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" id="password" value="password123">
        </div>
        <button onclick="testSignup()">Sign Up</button>
    </div>
    <div id="status">Ready...</div>

    <script>
        async function testSignup() {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = "Sending request...";
            statusDiv.className = "";
            
            const email = document.getElementById('email').value;
            const fullName = document.getElementById('fullname').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:8000/api/auth/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        full_name: fullName,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.textContent = "✅ Success!\n\nToken: " + data.access_token.substring(0, 20) + "...\n\nCheck your MongoDB and Email now.";
                    statusDiv.className = "success";
                } else {
                    statusDiv.textContent = "❌ Error " + response.status + ":\n" + JSON.stringify(data, null, 2);
                    statusDiv.className = "error";
                }
            } catch (error) {
                statusDiv.textContent = "❌ Network Error:\nIt seems the frontend cannot reach the backend.\n\nDetails: " + error.message;
                statusDiv.className = "error";
            }
        }
    </script>
</body>
</html>
